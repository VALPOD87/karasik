<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfeefe">
<title>Карасик</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfeefe;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#stage{display:block;width:100vw;height:100vh;overflow:visible;touch-action:none}
text{font-family:Nunito,'Arial Rounded MT Bold',Arial,sans-serif;font-weight:900;pointer-events:none}
.btn{cursor:pointer}
.pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.glow *{animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{fill:#c5d0dd}to{fill:#ffe27a}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-18px)}}
.wiggle{animation:wig .45s ease-in-out 2;transform-box:fill-box;transform-origin:center}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#rot{display:none;position:fixed;inset:0;background:#cfeefe;align-items:center;justify-content:center;flex-direction:column;font:900 44px Nunito,Arial,sans-serif;color:#ff8f1f;z-index:9;text-align:center}
#rot .ic{font-size:120px;margin-bottom:20px}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <g id="scene"></g>
  <g id="ui"></g>
  <g id="fx"></g>
</svg>
<div id="rot"><div class="ic">📱↻</div><div>Поверни планшет<br>боком</div></div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const stage=$('stage'),sceneG=$('scene'),uiG=$('ui'),fxG=$('fx');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function pt(ev){const p=stage.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(stage.getScreenCTM().inverse());}
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function starD(cx,cy,R,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1);}return d+'Z';}

/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem('karasik_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('karasik_'+k,JSON.stringify(v));}catch(e){}}};
const S={stars:store.get('stars',0),buildIdx:store.get('buildIdx',0),sound:store.get('sound',true),voice:store.get('voice',true),looks:store.get('looks',{}),album:store.get('album',[]),charIdx:store.get('charIdx',0),abcLvl:store.get('abcLvl',0),numLvl:store.get('numLvl',0),abcMode:store.get('abcMode','num'),orderLvl:store.get('orderLvl',0),orderWins:store.get('orderWins',0)};
function save(){for(const k in S)store.set(k,S[k]);}

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,dur,type,vol,delay,slide){const a=ac();if(!a||!S.sound)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);}
const SFX={
  pop(){tone(520,.12,'sine',.25,0,900);},
  pick(){tone(700,.1,'triangle',.18,0,1050);},
  snap(){tone(660,.12,'triangle',.28);tone(990,.18,'triangle',.22,.07);},
  back(){tone(500,.22,'sine',.15,0,330);},
  wrong(){tone(320,.28,'sine',.22,0,210);},
  tada(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.22,i*.11));tone(1568,.6,'sine',.1,.45);},
  sparkle(){[1200,1500,1800,2400].forEach((f,i)=>tone(f,.15,'sine',.1,i*.05));},
  bubble(){tone(300,.15,'sine',.3,0,1400);},
  click(){const a=ac();if(!a||!S.sound)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*.09),a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.3;s.connect(g);g.connect(a.destination);s.start();}
};

/* ---------- voice ---------- */
let ruVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));ruVoice=vs.find(v=>/Milena|Милена/i.test(v.name))||vs.find(v=>/Google/i.test(v.name))||vs[0]||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function say(text,delay){if(!S.voice||!('speechSynthesis' in window))return;const go=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';if(ruVoice)u.voice=ruVoice;u.rate=.88;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}};delay?setTimeout(go,delay):go();}
let unlocked=false;
function unlock(){ac();if(!unlocked&&'speechSynthesis' in window){unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}}
window.addEventListener('pointerup',unlock,true);
window.addEventListener('touchend',unlock,true);

/* ---------- animation helpers ---------- */
const ease={out:t=>1-Math.pow(1-t,3),back:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);},inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lin:t=>t,in:t=>t*t*t};
function tween(dur,fn,done,e){e=e||ease.out;const t0=performance.now();function f(now){const t=Math.min(1,(now-t0)/dur);fn(e(t));if(t<1)requestAnimationFrame(f);else if(done)done();}requestAnimationFrame(f);}
function confetti(x,y,n,spd){n=n||90;spd=spd||1;const cols=['#ff5d73','#ffd23f','#3bceac','#4d9de0','#b388eb','#ff9f1c'];const ps=[];for(let i=0;i<n;i++){const isStar=i%4===0;const r=isStar?el('path',{d:starD(0,0,14,6),fill:cols[i%cols.length]},fxG):el('rect',{x:-9,y:-5,width:18,height:10,rx:3,fill:cols[i%cols.length]},fxG);const a=Math.random()*Math.PI*2,s=(6+Math.random()*14)*spd;ps.push({r,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-9*spd,rot:Math.random()*360,vr:(Math.random()-.5)*20});}let fr=0;const life=n>40?120:60;(function step(){fr++;for(const p of ps){p.vy+=.55;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.r.setAttribute('transform',`translate(${p.x},${p.y}) rotate(${p.rot})`);p.r.setAttribute('opacity',Math.max(0,1-fr/life));}if(fr<life)requestAnimationFrame(step);else ps.forEach(p=>p.r.remove());})();}
function burst(x,y){confetti(x,y,22,.6);}

/* tap = pointerdown + pointerup on the same element */
function tap(node,fn){node.classList.add('btn');node.addEventListener('pointerdown',()=>{node._d=performance.now();});node.addEventListener('pointerup',e=>{if(node._d&&performance.now()-node._d<1500){node._d=0;fn(e);}});}

/* ---------- global drag routing ---------- */
let onMove=null,onUp=null;
window.addEventListener('pointermove',e=>{if(onMove)onMove(e);});
window.addEventListener('pointerup',e=>{if(onUp)onUp(e);});
window.addEventListener('pointercancel',e=>{if(onUp)onUp(e);});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- scenes ---------- */
let token=0;
function go(scene){token++;onMove=onUp=null;sceneG.innerHTML='';uiG.innerHTML='';fxG.innerHTML='';try{speechSynthesis.cancel();}catch(e){}scene();}

function drawUI(isHome){
  uiG.innerHTML='';
  const st=el('g',{transform:'translate(1440,78)'},uiG);
  st.innerHTML=`<rect x="-62" y="-50" width="190" height="100" rx="50" fill="#fff" opacity=".9"/><path d="${starD(-10,0,38,17)}" fill="#ffd23f" stroke="#e0a800" stroke-width="5" stroke-linejoin="round"/><text id="starTxt" x="40" y="22" font-size="62" fill="#ff8f1f">${S.stars}</text>`;
  if(!isHome){
    const h=el('g',{},uiG);
    h.innerHTML=`<circle cx="88" cy="80" r="62" fill="#fff" stroke="#4d9de0" stroke-width="7"/><path d="M58 84 L88 54 L118 84 L118 112 L58 112 Z" fill="#4d9de0" stroke="#4d9de0" stroke-width="8" stroke-linejoin="round"/><path d="M48 88 L88 48 L128 88" fill="none" stroke="#2f6fb0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="80" y="92" width="16" height="20" rx="3" fill="#fff"/>`;
    tap(h,()=>{SFX.pop();go(home);});
  }
}
function updStars(){const t=$('starTxt');if(t)t.textContent=S.stars;}
function addStar(x,y){const g=el('g',{},fxG);g.innerHTML=`<path d="${starD(0,0,42,19)}" fill="#ffd23f" stroke="#e0a800" stroke-width="5" stroke-linejoin="round"/>`;tween(950,t=>{const px=x+(1430-x)*t,py=y+(78-y)*t-220*Math.sin(Math.PI*t);g.setAttribute('transform',`translate(${px},${py}) rotate(${t*360}) scale(${1+.7*Math.sin(Math.PI*t)})`);},()=>{g.remove();S.stars++;save();updStars();SFX.pop();},ease.inout);}

/* ---------- fish mascot ---------- */
function fishSVG(c){c=c||'#ffa62b';return `<path d="M-95 0 L-165 -62 L-150 0 L-165 62 Z" fill="#ff8f1f" stroke="#d9781a" stroke-width="6" stroke-linejoin="round"/><path d="M-30 -66 Q10 -118 55 -62" fill="#ff8f1f" stroke="#d9781a" stroke-width="6"/><ellipse rx="112" ry="74" fill="${c}" stroke="#d9781a" stroke-width="6"/><path d="M-30 -32 Q-10 0 -30 32" fill="none" stroke="#e58a1f" stroke-width="6" stroke-linecap="round"/><path d="M-62 -26 Q-45 0 -62 26" fill="none" stroke="#e58a1f" stroke-width="6" stroke-linecap="round"/><circle cx="55" cy="-16" r="20" fill="#fff"/><circle cx="60" cy="-14" r="11" fill="#222"/><circle cx="64" cy="-19" r="4" fill="#fff"/><path d="M80 22 Q92 32 104 18" fill="none" stroke="#a24d0b" stroke-width="6" stroke-linecap="round"/><circle cx="40" cy="22" r="10" fill="#ff7aa2" opacity=".5"/>`;}

/* ================= HOME ================= */
function home(){
  document.body.style.background='#cfeefe';
  const tk=token;
  sceneG.innerHTML=`<rect x="-2000" y="-2000" width="5600" height="5000" fill="#cfeefe"/>
  <circle cx="150" cy="140" r="80" fill="#ffe066"/>
  <g fill="#fff" opacity=".9"><ellipse cx="420" cy="120" rx="90" ry="40"/><ellipse cx="480" cy="100" rx="70" ry="45"/><ellipse cx="1150" cy="190" rx="100" ry="40"/><ellipse cx="1210" cy="165" rx="70" ry="45"/></g>
  <path d="M-2000 790 Q-100 760 0 790 T 200 790 T 400 790 T 600 790 T 800 790 T 1000 790 T 1200 790 T 1400 790 T 1600 790 T 1800 790 L3600 790 L3600 3000 L-2000 3000 Z" fill="#7cc8f2"/>
  <path d="M-2000 830 L3600 830 L3600 3000 L-2000 3000 Z" fill="#5fb6e8"/>
  <text x="800" y="185" text-anchor="middle" font-size="140" fill="#ff8f1f" stroke="#fff" stroke-width="18" paint-order="stroke" stroke-linejoin="round">Карасик</text>`;
  const tiles=[
    {x:330,label:'Строим',col:'#3bceac',fn:build,voice:'Строим!',icon:`<rect x="-95" y="-10" width="150" height="120" rx="10" fill="#ffc94d" stroke="#e0a800" stroke-width="6"/><path d="M-115 -10 L-20 -100 L75 -10 Z" fill="#ff5d73" stroke="#c9184a" stroke-width="6" stroke-linejoin="round"/><rect x="-40" y="40" width="40" height="70" rx="6" fill="#8a5a3c"/><circle cx="100" cy="85" r="30" fill="#4d9de0" stroke="#2f6fb0" stroke-width="6"/><rect x="70" y="-20" width="50" height="50" rx="8" fill="#7ed957" stroke="#3a9e2f" stroke-width="6" transform="rotate(15 95 5)"/>`},
    {x:800,label:'Наряжаем',col:'#ff8fc0',fn:dressScene,voice:'Наряжаем!',icon:`<g transform="translate(0,25) scale(.5)">${dressSVG('#ff9ecb','#e5679f','dots')}</g><g transform="translate(0,138) scale(.7)">${HEADS.crown}</g>`},
    {x:1270,label:'Буквы и цифры',col:'#b388eb',fn:abcScene,voice:'Буквы и цифры!',icon:`<circle cx="-60" cy="-30" r="62" fill="#ffd23f" opacity=".95"/><text x="-60" y="2" text-anchor="middle" font-size="96" fill="#fff" stroke="#e0a800" stroke-width="6" paint-order="stroke">А</text><circle cx="60" cy="50" r="62" fill="#4d9de0"/><text x="60" y="82" text-anchor="middle" font-size="96" fill="#fff" stroke="#2f6fb0" stroke-width="6" paint-order="stroke">3</text>`}
  ];
  tiles.forEach(t=>{
    const g=el('g',{transform:`translate(${t.x},480)`},sceneG);
    const inner=el('g',{},g);
    inner.innerHTML=`<rect x="-200" y="-215" width="400" height="430" rx="60" fill="#fff" stroke="${t.col}" stroke-width="12"/><g transform="translate(0,-25)">${t.icon}</g><text y="170" text-anchor="middle" font-size="44" fill="${t.col}">${t.label}</text>`;
    tap(g,()=>{SFX.pop();say(t.voice);inner.setAttribute('transform','scale(.94)');setTimeout(()=>go(t.fn),180);});
  });
  // swimming fish
  const fg=el('g',{},sceneG);const fi=el('g',{},fg);fi.innerHTML=fishSVG();
  let x=-200,dir=1;
  tap(fg,()=>{SFX.bubble();say('Привет! Я Карасик!');burst(x,880);});
  (function loop(){if(tk!==token)return;x+=dir*2.4;if(x>1780)dir=-1;if(x<-180)dir=1;fg.setAttribute('transform',`translate(${x},${895+Math.sin(x/70)*14}) scale(${dir*.7},.7)`);requestAnimationFrame(loop);})();
  drawUI(true);
  // parent gear (long press)
  const gear=el('g',{opacity:.55},uiG);
  gear.innerHTML=`<circle cx="70" cy="940" r="38" fill="#fff"/><circle cx="70" cy="940" r="16" fill="none" stroke="#8a97a8" stroke-width="9"/><g stroke="#8a97a8" stroke-width="9" stroke-linecap="round">${[0,45,90,135].map(a=>`<line x1="70" y1="912" x2="70" y2="968" transform="rotate(${a} 70 940)"/>`).join('')}</g><circle cx="70" cy="940" r="10" fill="#fff"/>`;
  let tm=null,ring=null;
  gear.addEventListener('pointerdown',()=>{ring=el('circle',{cx:70,cy:940,r:50,fill:'none',stroke:'#ff8f1f','stroke-width':8,'stroke-dasharray':'314','stroke-dashoffset':'314',transform:'rotate(-90 70 940)'},uiG);const t0=performance.now();(function f(){if(!ring)return;const t=Math.min(1,(performance.now()-t0)/1500);ring.setAttribute('stroke-dashoffset',314*(1-t));if(t<1)requestAnimationFrame(f);})();tm=setTimeout(()=>{if(ring){ring.remove();ring=null;}parentPanel();},1500);});
  const cancel=()=>{clearTimeout(tm);if(ring){ring.remove();ring=null;}};
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,cancel));
}

function parentPanel(){
  const ov=el('g',{},uiG);
  const draw=()=>{
    ov.innerHTML=`<rect x="-2000" y="-2000" width="5600" height="5000" fill="rgba(30,40,60,.6)"/><rect x="450" y="150" width="700" height="720" rx="50" fill="#fff"/><text x="800" y="245" text-anchor="middle" font-size="52" fill="#4a5568">Для родителей</text>`;
    const rows=[
      [`Звуки: ${S.sound?'вкл':'выкл'}`,()=>{S.sound=!S.sound;save();draw();}],
      [`Голос: ${S.voice?'вкл':'выкл'}`,()=>{S.voice=!S.voice;save();draw();}],
      ['На весь экран',()=>{try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}catch(e){}}],
      ['Сбросить звёзды и уровни',()=>{Object.assign(S,{stars:0,buildIdx:0,abcLvl:0,numLvl:0,orderLvl:0,orderWins:0,looks:{},album:[]});save();go(home);}],
      ['Закрыть',()=>ov.remove()]
    ];
    rows.forEach(([lab,fn],i)=>{const g=el('g',{},ov);g.innerHTML=`<rect x="520" y="${290+i*110}" width="560" height="88" rx="44" fill="${i===4?'#4d9de0':'#eef2f7'}"/><text x="800" y="${348+i*110}" text-anchor="middle" font-size="38" fill="${i===4?'#fff':'#4a5568'}">${lab}</text>`;tap(g,fn);});
  };
  draw();
}

/* ================= BUILD (silhouette puzzles) ================= */
function shp(s,fill,stroke,sw){
  stroke=stroke||'rgba(0,0,0,.2)';sw=sw==null?6:sw;
  const a=`fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;let m='';
  if(s.t==='rect')m=`<rect x="${-s.w/2}" y="${-s.h/2}" width="${s.w}" height="${s.h}" rx="${s.r||12}" ${a}/>`;
  else if(s.t==='tri')m=`<path d="M0 ${-s.h/2} L${s.w/2} ${s.h/2} L${-s.w/2} ${s.h/2} Z" ${a}/>`;
  else if(s.t==='circ')m=`<circle r="${s.r}" ${a}/>`;
  else if(s.t==='ell')m=`<ellipse rx="${s.rx}" ry="${s.ry}" ${a}/>`;
  else if(s.t==='poly')m=`<path d="${s.d}" ${a}/>`;
  if(s.rot)m=`<g transform="rotate(${s.rot})">${m}</g>`;
  return m;
}
const WIN='#bfe8ff',DARK='#3a3a48',HUB='<circle r="20" fill="#cfd6de"/>';
const PUZ=[
  {done:'Ура! Получился домик!',ask:'Собери домик!',anim:'bounce',parts:[
    {s:{t:'rect',w:300,h:220,r:10},x:0,y:70,c:'#ffc94d',deco:'<rect x="-120" y="-60" width="72" height="62" rx="8" fill="#bfe8ff" stroke="#fff" stroke-width="6"/>'},
    {s:{t:'tri',w:390,h:170},x:0,y:-125,c:'#ff5d73'},
    {s:{t:'rect',w:84,h:130,r:10},x:65,y:115,c:'#8a5a3c',deco:'<circle cx="22" cy="5" r="8" fill="#ffd23f"/>'}]},
  {done:'Ура! Получилась машинка! Би-би!',ask:'Собери машинку!',anim:'drive',parts:[
    {s:{t:'poly',d:'M-125 50 L125 50 L85 -50 L-90 -50 Z'},x:-20,y:-80,c:'#7fc0ff',deco:'<path d="M-88 38 L-8 38 L-8 -36 L-62 -36 Z" fill="#e6f6ff"/><path d="M8 38 L95 38 L70 -36 L8 -36 Z" fill="#e6f6ff"/>'},
    {s:{t:'rect',w:450,h:120,r:40},x:0,y:30,c:'#4d9de0',deco:'<circle cx="198" cy="-15" r="15" fill="#ffe066"/><rect x="-215" y="-12" width="34" height="16" rx="6" fill="#ff5d73"/>'},
    {s:{t:'circ',r:60},x:-135,y:105,c:DARK,deco:HUB},
    {s:{t:'circ',r:60},x:135,y:105,c:DARK,deco:HUB}]},
  {done:'Ура! Получилась рыбка, как Карасик!',ask:'Собери рыбку!',anim:'swim',parts:[
    {s:{t:'poly',d:'M80 0 L-70 -95 L-48 0 L-70 95 Z'},x:-235,y:0,c:'#ff8f1f'},
    {s:{t:'tri',w:170,h:110},x:-10,y:-150,c:'#ff8f1f'},
    {s:{t:'ell',rx:195,ry:125},x:0,y:0,c:'#ffa62b',deco:'<path d="M-40 -62 Q-8 0 -40 62" fill="none" stroke="#e58a1f" stroke-width="8" stroke-linecap="round"/><path d="M-105 -45 Q-80 0 -105 45" fill="none" stroke="#e58a1f" stroke-width="8" stroke-linecap="round"/><path d="M115 40 Q137 56 158 34" fill="none" stroke="#a24d0b" stroke-width="8" stroke-linecap="round"/>'},
    {s:{t:'circ',r:40},x:95,y:-30,c:'#ffffff',deco:'<circle cx="6" cy="3" r="20" fill="#222"/><circle cx="12" cy="-5" r="7" fill="#fff"/>'}]},
  {done:'Ура! Получилась ёлочка!',ask:'Собери ёлочку!',anim:'tree',parts:[
    {s:{t:'rect',w:80,h:90,r:8},x:0,y:235,c:'#8a5a3c'},

function build(){
  document.body.style.background='#e6f4ea';
  const P=PUZ[S.buildIdx%PUZ.length],BX=560,BY=545,tk=token;
  sceneG.innerHTML=`<rect x="-2000" y="-2000" width="5600" height="5000" fill="#e6f4ea"/><rect x="110" y="160" width="900" height="800" rx="50" fill="#fff" stroke="#cde7d6" stroke-width="8"/><rect x="1050" y="160" width="520" height="800" rx="50" fill="#d4eedd"/>`;
  // progress dots
  const dots=el('g',{},sceneG);
  PUZ.forEach((_,i)=>{const cur=i===S.buildIdx%PUZ.length;el('circle',{cx:560+(i-(PUZ.length-1)/2)*48,cy:90,r:cur?17:12,fill:cur?'#ffd23f':(i<S.buildIdx%PUZ.length?'#3bceac':'#cfe3d6'),stroke:cur?'#e0a800':'none','stroke-width':4},dots);});
  const silL=el('g',{},sceneG),placedL=el('g',{},sceneG),trayL=el('g',{},sceneG),dragL=el('g',{},sceneG);
  const keyOf=p=>JSON.stringify(p.s)+(p.deco||'')+p.c;
  const targets=P.parts.map((p,i)=>{const g=el('g',{transform:`translate(${BX+p.x},${BY+p.y})`},silL);g.innerHTML=shp(p.s,'#c5d0dd','none',0);return {i,key:keyOf(p),x:BX+p.x,y:BY+p.y,filled:false,g};});
  const order=shuffle([...P.parts.keys()]);
  const n=order.length,cols=n<=3?1:2,rows=Math.ceil(n/cols),cw=520/cols,chh=800/rows;
  let busy=false,drag=null;
  const pieces=order.map((pi,k)=>{
    const p=P.parts[pi];const g=el('g',{class:'btn'},trayL);
    g.innerHTML=shp(p.s,p.c)+(p.deco||'');
    const col=k%cols,row=Math.floor(k/cols);
    let hx=1050+cw*(col+.5);const hy=160+chh*(row+.5);
    if(cols===2&&n%2===1&&k===n-1)hx=1050+260;
    const bb=g.getBBox();const hs=Math.min(1,(cw-50)/bb.width,(chh-40)/bb.height);
    const pc={g,key:keyOf(p),hx,hy,hs,x:hx+700,y:hy,s:hs,placed:false};
    place(pc);
    setTimeout(()=>{if(tk!==token)return;const sx=pc.x;tween(500,t=>{pc.x=sx+(pc.hx-sx)*t;place(pc);},null,ease.back);},150+k*90);
    g.addEventListener('pointerdown',e=>{
      if(drag||pc.placed||busy)return;e.preventDefault();
      const q=pt(e);drag={pc,id:e.pointerId,dx:q.x-pc.x,dy:q.y-pc.y};
      dragL.appendChild(pc.g);SFX.pick();glow(pc.key,true);
      const s0=pc.s;tween(160,t=>{pc.s=s0+(1-s0)*t;drag&&(drag.dx=drag.dx);place(pc);});
    });
    return pc;
  });
  function place(pc){pc.g.setAttribute('transform',`translate(${pc.x},${pc.y}) scale(${pc.s})`);}
  function glow(key,on){targets.forEach(t=>{if(t.key===key&&!t.filled)t.g.classList.toggle('glow',on);else t.g.classList.remove('glow');});}
  onMove=e=>{if(!drag||e.pointerId!==drag.id)return;const q=pt(e);drag.pc.x=q.x-drag.dx;drag.pc.y=q.y-drag.dy;place(drag.pc);};
  onUp=e=>{
    if(!drag||e.pointerId!==drag.id)return;const pc=drag.pc;drag=null;glow(pc.key,false);
    let best=null,bd=1e9;targets.forEach(t=>{if(t.filled||t.key!==pc.key)return;const d=Math.hypot(pc.x-t.x,pc.y-t.y);if(d<bd){bd=d;best=t;}});
    if(best&&bd<180){
      best.filled=true;pc.placed=true;const sx=pc.x,sy=pc.y;
      tween(170,t=>{pc.x=sx+(best.x-sx)*t;pc.y=sy+(best.y-sy)*t;pc.s=1;place(pc);},()=>{
        pc.g.classList.remove('btn');pc.g.dataset.ti=best.i;
        const sib=[...placedL.children].find(c=>+c.dataset.ti>best.i);placedL.insertBefore(pc.g,sib||null);
        SFX.snap();burst(best.x,best.y);
        if(targets.every(t=>t.filled))complete();
      });
    }else{
      SFX.back();const sx=pc.x,sy=pc.y,ss=pc.s;
      tween(380,t=>{pc.x=sx+(pc.hx-sx)*t;pc.y=sy+(pc.hy-sy)*t;pc.s=ss+(pc.hs-ss)*t;place(pc);},()=>trayL.appendChild(pc.g),ease.back);
    }
  };
  function complete(){
    busy=true;
    setTimeout(()=>{
      if(tk!==token)return;
      SFX.tada();say(P.done);confetti(BX,BY-100);addStar(BX,BY);
      tween(400,t=>silL.setAttribute('opacity',1-t));
      const set=(dx,dy,r,s)=>placedL.setAttribute('transform',`translate(${dx},${dy}) rotate(${r||0},${BX},${BY}) translate(${BX},${BY}) scale(${s||1}) translate(${-BX},${-BY})`);
      const fin=()=>{set(0,0);showNext();};
      const a=P.anim;
      if(a==='drive')tween(1000,t=>set(1400*t,0),()=>tween(1000,t=>set(-1400*(1-t),0),fin,ease.out),ease.in);
      else if(a==='fly'){const fl=el('path',{d:`M${BX-45} ${BY+190} Q${BX} ${BY+330} ${BX+45} ${BY+190} Z`,fill:'#ffb703'},null);placedL.insertBefore(fl,placedL.firstChild);tween(1100,t=>set(0,-1300*t),()=>tween(1100,t=>set(0,1300*(1-t)),()=>{fl.remove();fin();},ease.out),ease.in);}
      else if(a==='swim')tween(1800,t=>set(90*Math.sin(t*Math.PI*2),25*Math.sin(t*Math.PI*4),8*Math.sin(t*Math.PI*6)),fin,ease.lin);
      else if(a==='rock')tween(1800,t=>set(0,12*Math.sin(t*Math.PI*4),10*Math.sin(t*Math.PI*4)),fin,ease.lin);
      else if(a==='tree'){const st=el('path',{d:starD(BX,BY-205,55,24),fill:'#ffd23f',stroke:'#e0a800','stroke-width':6,'stroke-linejoin':'round',opacity:0},placedL);tween(500,t=>st.setAttribute('opacity',t));tween(1100,t=>set(0,-Math.abs(Math.sin(t*Math.PI*2))*60,0,1+.04*Math.sin(t*Math.PI*4)),fin,ease.lin);}
      else tween(1100,t=>set(0,-Math.abs(Math.sin(t*Math.PI*2))*70,0,1+.05*Math.sin(t*Math.PI*4)),fin,ease.lin);
    },250);
  }
  function showNext(){
    if(tk!==token)return;
    const g=el('g',{},sceneG);const inner=el('g',{class:'pulse'},g);
    inner.innerHTML=`<circle cx="1310" cy="560" r="125" fill="#3bceac" stroke="#fff" stroke-width="10"/><path d="M1260 500 L1345 560 L1260 620 Z" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round"/>`;
    tap(g,()=>{SFX.pop();S.buildIdx=(S.buildIdx+1)%PUZ.length;save();go(build);});
  }
  drawUI(false);
  say(P.ask,400);
}

    S.album.forEach((a,i)=>{const c=CHARS.find(x=>x.id===a.c)||CHARS[0];const x=320+(i%4)*320,y=300+Math.floor(i/4)*400;const g=el('g',{},ov);g.innerHTML=`<rect x="${x-140}" y="${y-185}" width="280" height="370" rx="30" fill="#fde8f1" stroke="#f6c6dc" stroke-width="6"/><g transform="translate(${x},${y+40}) scale(.46)">${charSVG(c,a.l)}</g>`;tap(g,()=>{S.charIdx=CHARS.indexOf(c);ch=c;order=null;look=Object.assign({},a.l);cat='dress';S.looks[c.id]=Object.assign({},look);save();ov.remove();SFX.sparkle();say(c.name);renderAll();});});
    const x=el('g',{},ov);x.innerHTML=`<circle cx="1420" cy="110" r="58" fill="#ff5d73" stroke="#fff" stroke-width="8"/><path d="M1395 85 L1445 135 M1445 85 L1395 135" stroke="#fff" stroke-width="14" stroke-linecap="round"/>`;tap(x,()=>{SFX.pop();ov.remove();});
  }
  renderAll();drawUI(false);
  say('Наряжаем '+ch.acc+'!',400);
}

/* ================= LETTERS & NUMBERS ================= */
const LETTERS=[['А','а','арбуз'],['О','о','облако'],['У','у','утка'],['И','и','ирис'],['М','эм','мама'],['П','пэ','папа'],['Б','бэ','банан'],['Д','дэ','дом'],['К','ка','кот'],['Т','тэ','торт'],['Н','эн','нос'],['Л','эль','лиса'],['С','эс','сок'],['Р','эр','рыба'],['Ы','ы','сыр'],['Э','э','эхо'],['Я','я','яблоко'],['Е','е','ель'],['Ю','ю','юла'],['Ё','ё','ёжик'],['В','вэ','волк'],['Г','гэ','гусь'],['З','зэ','заяц'],['Ж','жэ','жук'],['Ш','ша','шар'],['Х','ха','хлеб'],['Ф','эф','флаг'],['Ц','цэ','цветок'],['Ч','че','чай'],['Щ','ща','щенок'],['Й','и краткое','йогурт'],['Ь','мягкий знак',''],['Ъ','твёрдый знак','']];
const NUMS=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять'];
const NUMACC=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять'];
const COUNT=['','Раз!','Раз, два!','Раз, два, три!','Раз, два, три, четыре!','Раз, два, три, четыре, пять!','Раз, два, три, четыре, пять, шесть!','Раз, два, три, четыре, пять, шесть, семь!','Раз, два, три, четыре, пять, шесть, семь, восемь!','Раз, два, три, четыре, пять, шесть, семь, восемь, девять!','Раз, два, три, четыре, пять, шесть, семь, восемь, девять, десять!'];
const BCOL=[['#ff5d73','#c9184a'],['#ffd23f','#e0a800'],['#3bceac','#24a084'],['#4d9de0','#2f6fb0'],['#b388eb','#7b4fc9'],['#ff9f1c','#d97a00']];
function abcScene(){
  document.body.style.background='#d9ecff';
  const tk=token;let mode=S.abcMode,target=null,busy=false,bubbles=[];
  sceneG.innerHTML=`<rect x="-2000" y="-2000" width="5600" height="5000" fill="#d9ecff"/><path d="M-2000 830 Q400 800 800 830 T 3600 830 L3600 3000 L-2000 3000 Z" fill="#9fd3f5"/>`;
  const topG=el('g',{},sceneG),bubG=el('g',{},sceneG),extraG=el('g',{},sceneG);
  function pool(){if(mode==='num'){const max=[3,5,7,10][Math.min(S.numLvl,3)];return [...Array(max)].map((_,i)=>i+1);}const n=[4,8,12,16,20,26,33][Math.min(S.abcLvl,6)];return LETTERS.slice(0,n).map(l=>l[0]);}
  const nameOf=v=>mode==='num'?NUMS[v]:LETTERS.find(l=>l[0]===v)[1];
  const askText=()=>mode==='num'?`Найди цифру ${NUMACC[target]}!`:`Найди букву ${nameOf(target)}!`;
  function renderTop(){topG.innerHTML='';[['abc','АБВ',640],['num','123',960]].forEach(([m,lab,x])=>{const sel=m===mode;const g=el('g',{},topG);g.innerHTML=`<rect x="${x-130}" y="40" width="260" height="96" rx="48" fill="${sel?'#4d9de0':'#fff'}" stroke="#4d9de0" stroke-width="6"/><text x="${x}" y="108" text-anchor="middle" font-size="60" fill="${sel?'#fff':'#4d9de0'}">${lab}</text>`;tap(g,()=>{if(sel||busy)return;mode=m;S.abcMode=m;save();SFX.pop();renderTop();round();});});
    const sp=el('g',{},topG);sp.innerHTML=`<circle cx="1220" cy="88" r="52" fill="#fff" stroke="#ff8f1f" stroke-width="6"/><path d="M1196 74 L1212 74 L1232 56 L1232 120 L1212 102 L1196 102 Z" fill="#ff8f1f"/><path d="M1244 72 Q1256 88 1244 104" fill="none" stroke="#ff8f1f" stroke-width="6" stroke-linecap="round"/>`;tap(sp,()=>{if(target!=null)say(askText());});}
  function round(){
    if(tk!==token)return;busy=false;bubG.innerHTML='';extraG.innerHTML='';bubbles=[];
    const p=pool();target=p[rnd(p.length)];
    const others=shuffle(p.filter(v=>v!==target)).slice(0,3);const vals=shuffle([target,...others]);
    const xs=[290,620,980,1310],ys=[480,600,460,590];
    vals.forEach((v,i)=>{const [c,dk]=BCOL[rnd(BCOL.length)];const g=el('g',{transform:`translate(${xs[i]},${ys[i]})`},bubG);const b=el('g',{class:'bob',style:`animation-delay:${-i*.7}s`},g);const inner=el('g',{},b);
      inner.innerHTML=`<circle r="140" fill="${c}" stroke="${dk}" stroke-width="8"/><ellipse cx="-55" cy="-65" rx="34" ry="20" fill="#fff" opacity=".45" transform="rotate(-35 -55 -65)"/><text y="60" text-anchor="middle" font-size="${String(v).length>1?150:180}" fill="#fff" stroke="${dk}" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${v}</text>`;
      inner.setAttribute('transform','scale(0)');setTimeout(()=>tween(420,t=>inner.setAttribute('transform',`scale(${t})`),null,ease.back),i*110);
      const bb={g,inner,v,x:xs[i],y:ys[i]};bubbles.push(bb);tap(g,()=>pick(bb));});
    say(askText(),500);
  }
  function popB(bb){SFX.bubble();burst(bb.x,bb.y);tween(220,t=>{bb.inner.setAttribute('transform',`scale(${1+.3*t})`);bb.inner.setAttribute('opacity',1-t);},()=>bb.g.remove());}
  function pick(bb){
    if(busy)return;
    if(bb.v===target){
      busy=true;popB(bb);setTimeout(()=>bubbles.forEach(o=>{if(o!==bb)popB(o);}),250);SFX.tada();confetti(bb.x,bb.y);addStar(bb.x,bb.y);
      let wait=2200;
      if(mode==='num'){
        say(`Ура! ${NUMS[target][0].toUpperCase()+NUMS[target].slice(1)}! ${COUNT[target]}`);
        for(let k=0;k<target;k++){const fx=800+(k-(target-1)/2)*Math.min(140,1300/target),fy=560;const g=el('g',{},extraG);const fi=el('g',{},g);fi.innerHTML=fishSVG(BCOL[k%BCOL.length][0]);g.setAttribute('transform',`translate(${fx},${fy+500}) scale(.5)`);setTimeout(()=>{tween(450,t=>g.setAttribute('transform',`translate(${fx},${fy+500*(1-t)}) scale(.5)`),()=>{fi.classList.add('wiggle');},ease.back);SFX.pop();},700+k*520);}
        wait=1800+target*520;
        S.numStreak=(S.numStreak||0)+1;if(S.numStreak>=5){S.numStreak=0;S.numLvl=Math.min(3,S.numLvl+1);}
      }else{
        const L=LETTERS.find(l=>l[0]===target);
        say(`Ура! Это ${L[1]}!`+(L[2]?` ${L[0]==='Ы'?'Как в слове':'Как'} ${L[2]}!`:''));
        const t=el('text',{x:800,y:640,'text-anchor':'middle','font-size':320,fill:'#ff8f1f',stroke:'#fff','stroke-width':16,'paint-order':'stroke'},extraG);t.textContent=target;tween(500,k=>t.setAttribute('transform',`translate(800,560) scale(${k}) translate(-800,-560)`),null,ease.back);
        S.abcStreak=(S.abcStreak||0)+1;if(S.abcStreak>=5){S.abcStreak=0;S.abcLvl=Math.min(6,S.abcLvl+1);}
      }
      save();setTimeout(round,wait);
    }else{
      SFX.wrong();bb.inner.classList.remove('wiggle');void bb.inner.getBBox();bb.inner.classList.add('wiggle');
      say(`Это ${nameOf(bb.v)}. ${askText()}`);
    }
  }
  renderTop();drawUI(false);round();
}

/* ---------- orientation hint ---------- */
let rotDismissed=false;
function checkRot(){$('rot').style.display=(!rotDismissed&&innerHeight>innerWidth*1.15)?'flex':'none';}
$('rot').addEventListener('pointerup',()=>{rotDismissed=true;checkRot();});
addEventListener('resize',checkRot);checkRot();

go(home);
</script>
